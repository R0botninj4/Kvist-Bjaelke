services:
  app:
    build: .
    ports:
      - "8000:8080"
    environment:
      BootstrapAdmin__Username: ${ADMIN_USERNAME:-admin}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ASPNETCORE_ENVIRONMENT: Production
      DataProtectionKeys: /data/keys
    volumes:
      - app-data:/data
    restart: unless-stopped
volumes:
  app-data:
